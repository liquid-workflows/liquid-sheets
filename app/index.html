<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquid Sheets</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2312171e'/><polygon points='14,22 32,32 32,52 14,42' fill='%233f8fa3'/><polygon points='32,32 50,22 50,42 32,52' fill='%2363b2c6'/><polygon points='32,12 50,22 32,32 14,22' fill='%23a8dbe6'/><polygon points='10,31 32,43 54,31 32,19' fill='%23eaf7fa' fill-opacity='.82' stroke='%2363b2c6' stroke-width='1.2'/><polygon points='32,12 50,22 50,42 32,52 14,42 14,22' fill='none' stroke='%23d6f0f5' stroke-width='1.4' stroke-linejoin='round'/></svg>">
<link rel="manifest" href="manifest.webmanifest">
<link rel="canonical" href="https://sheets.liquidworkflows.com/app/">
<meta name="theme-color" content="#12171e">
<style>
/* Split DATA vs CHROME tokens. DARK is the default (data-theme="dark" on the
 * root); light is the opt-out, set by the gear toggle via
 * document.documentElement.dataset.theme. Bare :root holds the light palette. */
:root{
  /* THE PRINTED SHEET: a warm-paper daylight mode, not a pale dark theme.
     Bone/cream stock, warm-black ink, tan rule lines, one confident ink-navy
     accent. It reads like the draft almanac you would print and mark up,
     which is exactly this app's offline paper-backup identity. */
  --ground:#e9e1d0; --zebra:#e1d8c4; --surface:#f7f1e3; --raised:#efe8d8;
  --input:#fcf8ef;
  --sel:#e5dcc2; --focus:#294c72;
  --line:#cbbfa4; --line-soft:#ded4bd;
  --text:#2a2620; --muted:#6c6353; --faint:#9a907a;
  --purple:#2c4a6e; --purple-soft:#ddd3ba;
  --gold:#294c72; --gold-hi:#1c3a5b; --gold-dim:#aab6c6;
  --good:#2b6a44; --bad:#9c3d30; --warn:#8a5a12;
  /* chrome (masthead band + rail): a deeper kraft/manila, like the toned
     header strip of a printed form, framing the paper board */
  --c-bg:#dacfb2; --c-panel:#d1c5a6; --c-line:#b4a582;
  --c-text:#2e281d; --c-muted:#6f6450; --c-chip:#e7ddc6;
  --c-gold:#294c72; --c-brand:#294c72;
  --picked-bg:#ece1c5; --mine-bg:#e9dfc9; --mine-odd:#e3d9c1;
  --stamp-bg:rgba(250,246,236,.96);
  --pos-qb:#1f5f96; --pos-rb:#1a7a5a; --pos-wr:#b3541a;
  --pos-te:#a83c6b; --pos-k:#6f7826; --pos-def:#9a7218; --pos-flx:#6a3fa0;
  --posbg-qb:#dde6ee; --posbg-rb:#dde9dc; --posbg-wr:#f1e3ce;
  --posbg-te:#f0dfe2; --posbg-k:#e9e6cd; --posbg-def:#efe5cb;
  --disp:"Copperplate","Copperplate Gothic Bold",Georgia,serif;
  --ui:Verdana,Geneva,"DejaVu Sans",sans-serif;
  --mono:Menlo,"SF Mono",Consolas,monospace;
}
/* DARK theme: neutral slate data board with a cool graphite chrome and
 * steel-cyan accents (team-neutral; the chrome is separated from the data
 * board by a cool hue, not by purple). */
:root[data-theme="dark"]{
  --ground:#1e2027; --zebra:#24262e; --surface:#272a33; --raised:#2f323c;
  --input:#17191f;
  --sel:#26333f; --focus:#7fb4d6;
  --line:#3b3f49; --line-soft:#31343d;
  --text:#d6d2c9; --muted:#98948b; --faint:#6f6b63;
  --purple:#8fb6cf; --purple-soft:#22313d;
  --gold:#63b2c6; --gold-hi:#82c8da; --gold-dim:#3a6470;
  --good:#66bd8f; --bad:#e08563; --warn:#d6b45a;
  --c-bg:#12171e; --c-panel:#0c1015; --c-line:#28323d;
  --c-text:#d4d9df; --c-muted:#8b939d; --c-chip:#19212a;
  --c-gold:#63b2c6; --c-brand:#a7c3d6;
  --picked-bg:#1c2833; --mine-bg:#202c37; --mine-odd:#1b2731;
  --stamp-bg:rgba(18,20,24,.95);
  --pos-qb:#4aa2e8; --pos-rb:#35c095; --pos-wr:#f08a3e;
  --pos-te:#f06ea9; --pos-k:#b5c445; --pos-def:#e0b246; --pos-flx:#a982f5;
  --posbg-qb:#14213f; --posbg-rb:#0f2e28; --posbg-wr:#3a1c10;
  --posbg-te:#3a1230; --posbg-k:#2b2e12; --posbg-def:#33290f;
}
/* dark-theme sidebar: cool steel-slate panels so the rail never reads as the
 * same material as the neutral board (re-scopes tokens under #rail). */
:root[data-theme="dark"] #rail{
  --surface:#1a232d; --zebra:#1f2833; --raised:#26313d;
  --line:#2f3b47; --line-soft:#28323d; --input:#12181f;
}
/* light-theme sidebar: warmer kraft stock with lighter paper cards, so the
 * rail reads as the folder the sheet sits in (mirrors the dark rail). */
:root:not([data-theme="dark"]) #rail{
  --surface:#efe7d6; --zebra:#e7ddc8; --raised:#f4eede;
  --line:#c6b795; --line-soft:#d9cdb1; --input:#f9f4ea;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--ground);color:var(--text);font-family:var(--ui);
  font-size:15px;font-variant-numeric:tabular-nums;overflow:hidden}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font-family:inherit;color:inherit}
::selection{background:var(--purple-soft)}
#errbar{display:none;position:fixed;top:0;left:0;right:0;z-index:99;
  background:#b33049;color:#fff;padding:8px 14px;font-size:13px;
  font-family:var(--mono);font-weight:700}

/* ---------- top chrome bar ---------- */
header{display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;
  border-bottom:2px solid var(--c-line);background:var(--c-bg)}
#mast{font-family:var(--disp);font-size:15px;letter-spacing:.12em;
  color:var(--c-brand);white-space:nowrap;display:flex;align-items:center;gap:9px}
#mast .mark{width:26px;height:26px;flex:none;border-radius:6px;cursor:pointer}
#mast .mark:hover{filter:brightness(1.25)}
.optcards.two{grid-template-columns:1fr 1fr;margin:0 0 14px}
.empty .optcards{max-width:520px;margin:14px auto 0;text-align:left}
#mast small{display:block;font-family:var(--ui);font-size:9px;
  letter-spacing:.26em;color:var(--c-muted);font-weight:700;margin-top:2px}
#leaguesel{font:inherit;font-family:var(--ui);font-size:11px;letter-spacing:.04em;
  font-weight:700;color:var(--c-muted);background:transparent;
  border:1px solid var(--c-line);border-radius:4px;padding:1px 4px;max-width:220px;
  cursor:pointer}
#leaguesel:hover,#leaguesel:focus{color:var(--c-text);border-color:var(--c-gold);
  outline:none}
#leaguesel option{color:var(--text);background:var(--surface)}
.delwrap{margin-top:18px;padding-top:12px;border-top:1px solid var(--line-soft)}
/* teams step: reorderable list */
.teamlist{display:flex;flex-direction:column;gap:4px;max-height:52vh;overflow:auto;
  padding-right:2px}
.trow{display:grid;grid-template-columns:26px 1fr 34px;gap:8px;align-items:center;
  padding:3px 6px 3px 4px;border:1px solid var(--line-soft);border-radius:6px;
  background:var(--raised)}
.trow.thead{background:transparent;border-color:transparent;padding-top:0;padding-bottom:2px;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.trow.thead span:nth-child(2){padding-left:8px}
.trow.thead span:nth-child(3){text-align:center}
.trow .melab{justify-content:center}
.trow.isme{border-color:var(--gold-dim)}
.trow.drag{opacity:.4}
.trow.over{border-color:var(--gold);box-shadow:inset 0 2px 0 var(--gold)}
.trow .grip{color:var(--faint);cursor:grab;font-family:var(--mono);font-size:14px;
  text-align:center;user-select:none;touch-action:none;align-self:stretch;
  display:flex;align-items:center;justify-content:center}
.trow .grip:active{cursor:grabbing}
/* fatter drag handle on touch devices, where the thumb needs a real target */
@media (pointer: coarse) {
  .trow{grid-template-columns:40px 1fr 40px}
  .trow .grip{font-size:20px}
}
.trow input[type=text]{font:inherit;padding:4px 8px;border:1px solid transparent;
  border-radius:4px;background:transparent;color:var(--text);width:100%}
.trow input[type=text]:hover{border-color:var(--line)}
.trow input[type=text]:focus{border-color:var(--gold);background:var(--input);outline:none}
.melab{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);
  cursor:pointer;white-space:nowrap}
.melab input{accent-color:var(--gold);margin:0}
.trow.isme .melab{color:var(--gold);font-weight:700}
.gver{color:var(--c-muted);font-size:10px;font-family:var(--mono);
  padding:4px 10px 2px;text-align:right}
.gearwrap{position:relative}
.hspace{flex:1}
#hleft{display:flex;gap:8px;align-items:center}
#hleft:empty,#hcenter:empty{display:none}
#hcenter{display:flex;align-items:center}
#gearbtn{display:inline-flex;align-items:center;padding:7px 9px;
  border:1px solid var(--c-line);border-radius:4px;background:var(--c-chip);
  color:var(--c-muted)}
#gearbtn:hover{color:var(--c-text)}
.gearmenu{position:absolute;right:0;top:calc(100% + 6px);
  background:var(--c-chip);border:1px solid var(--c-line);border-radius:6px;
  box-shadow:0 12px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;
  min-width:200px;z-index:40;overflow:hidden;padding:6px}
.gearmenu[hidden]{display:none}
.gearmenu button[hidden]{display:none}
.gearmenu{min-width:236px}
.gstat{padding:6px 10px 8px;font-size:12.5px;color:var(--c-text)}
.gstat small{display:block;color:var(--c-muted);font-size:11px;margin-top:2px;
  line-height:1.4;font-family:var(--mono)}
#notice{display:none;background:var(--c-chip);border-bottom:1px solid var(--c-gold);
  color:var(--c-text);font-size:13px;padding:8px 16px;gap:12px;align-items:center}
#notice.show{display:flex}
#notice span{flex:1}
.gearmenu button{border:none;background:none;border-radius:4px;
  text-align:left;padding:8px 10px;font-size:13px;color:var(--c-text)}
.gearmenu button:hover{background:var(--c-bg)}
.gtoggle{display:flex;align-items:center;justify-content:space-between;gap:10px}
.gtoggle .sw{position:relative;width:34px;height:18px;border-radius:9px;
  background:var(--c-line);transition:background .15s;flex:none}
.gtoggle .sw .knob{position:absolute;top:2px;left:2px;width:14px;height:14px;
  border-radius:50%;background:var(--c-chip);transition:left .15s;
  box-shadow:0 1px 2px rgba(0,0,0,.4)}
.gtoggle.on .sw{background:var(--c-gold)}
.gtoggle.on .sw .knob{left:18px}
.gearmenu button.gdanger{color:var(--bad);font-weight:700}
.gearmenu button.gdanger:hover{background:var(--c-bg)}
/* direct actions (no sub-panel) read as pressable buttons, not menu rows */
.gearmenu button.gact{border:1px solid var(--c-line);background:var(--c-bg);
  margin:3px 2px;font-weight:600;text-align:center}
.gearmenu button.gact:hover{background:var(--c-line)}
.gearmenu button.gact.gdanger{border-color:var(--bad)}
.gearmenu button.gact.gdanger:hover{background:var(--c-line)}
/* the mixer (V56): chip summary + a left-anchored gear-style menu */
.mixchip{position:relative}
#mixbtn{display:flex;align-items:center;gap:6px;background:transparent;border:none;padding:0;
  margin-top:1px;color:var(--c-text);font-family:var(--mono);font-size:13px;font-weight:700;
  cursor:pointer;max-width:230px;white-space:nowrap}
#mixbtn .caret{color:var(--c-muted);font-size:11px}
#mixbtn:hover .caret{color:var(--c-gold)}
#mixsum{overflow:hidden;text-overflow:ellipsis}
#mixsum .calls{color:var(--c-brand)}
#mixsum .n{color:var(--c-muted);font-weight:400;font-size:11px;margin-left:4px}
.mixmenu{left:-1px;right:auto;top:calc(100% + 4px);min-width:236px;text-align:left}
.mixmenu .glab{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--c-muted);
  padding:4px 10px 5px}
.mixmenu .gtoggle span:first-child{font-family:var(--mono);font-size:12.5px}
.mixmenu .gtoggle:disabled{opacity:.45;cursor:default}
#mixcalls.on span:first-child{color:var(--c-brand)}
#mixcalls.on .sw{background:var(--c-brand)}
.mixmenu .gfoot{display:flex;justify-content:space-between;align-items:baseline;padding:8px 10px 3px;
  font-size:10px;color:var(--c-muted);letter-spacing:.04em}
#mixrun{font-family:var(--mono);font-size:11px;color:var(--c-text)}

/* ---------- topbar chips row ---------- */
.topbar{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;
  padding:8px 16px;background:var(--c-bg);border-bottom:1px solid var(--c-line)}
.chip{font-size:12px;color:var(--c-muted);border:1px solid var(--c-line);
  border-radius:4px;padding:4px 10px;white-space:nowrap;background:var(--c-chip);
  line-height:1.35;min-height:44px;display:flex;flex-direction:column;
  justify-content:center}
.chip .lab{display:block;font-size:9px;letter-spacing:.16em;color:var(--c-muted);
  text-transform:uppercase}
.chip b{color:var(--c-text);font-family:var(--mono);font-size:13px}
.chip .g{color:var(--c-gold);font-family:var(--mono);font-weight:700}
.chip .cval{display:flex;gap:5px;align-items:baseline;white-space:nowrap}
.topbar .spacer{flex:1}
#infl.hot b{color:var(--warn)}
.bar{display:block;margin-top:4px;height:4px;width:100%;background:var(--c-line);
  border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-gold)}
.gauge{display:block;position:relative;margin-top:5px;height:4px;
  background:var(--c-line);border-radius:2px;min-width:76px}
.gauge::after{content:"";position:absolute;left:50%;top:-2px;width:1px;
  height:8px;background:var(--c-muted)}
.gauge i{position:absolute;top:-2px;width:8px;height:8px;border-radius:50%;
  background:var(--c-gold);transform:translateX(-50%)}
.segs{display:flex;gap:2px;margin-top:5px}
.segs i{width:9px;height:4px;border-radius:1px;background:var(--c-line)}
.topbar > button{font-size:12px;font-weight:700;letter-spacing:.08em;
  color:var(--c-muted);border:1px solid var(--c-line);border-radius:4px;
  padding:8px 12px;background:var(--c-chip);align-self:center}
.topbar > button:hover{color:var(--c-text)}
.topbar > button.danger:hover{color:var(--bad);border-color:var(--bad)}

/* ---------- layout: full-viewport app frame (ported); the page never
 * scrolls, the board and rail scroll inside their own columns ---------- */
#main{display:flex;flex-direction:column;height:calc(100% - 56px);
  overflow-y:auto}
.layout{flex:1;min-height:0;display:grid;grid-template-columns:1fr 312px}
.boardcol{min-width:0;display:flex;flex-direction:column;overflow:hidden;
  border-right:2px solid var(--line)}
.boardscroll{flex:1;min-height:0;overflow-y:auto}
.cols{display:grid;grid-template-columns:1fr 1.05fr 1.05fr 1fr .8fr;gap:1px;
  background:var(--line-soft)}
.poscol{background:var(--ground);min-width:0}
.colhead{position:sticky;top:0;z-index:2;background:var(--surface);
  border-bottom:2px solid var(--line);padding:8px 8px 0}
.colhead .t1{display:flex;align-items:baseline;gap:8px;font-weight:700;
  font-size:14px;letter-spacing:.1em;color:var(--text)}
.colhead .t1 small{font-weight:400;font-size:10px;letter-spacing:.02em;
  color:var(--faint);cursor:help}
.colhead .t2{display:grid;gap:6px;padding:5px 0 4px;font-size:9px;
  letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
.colhead .t2 span:last-child,.colhead .t2 span.r,
.colhead .t2 .edge,.colhead .t2 .pts{text-align:right}
.sortable{cursor:pointer}
.sortable.on{color:var(--text);text-decoration:underline}
.sortable:hover{color:var(--text)}
.kd{cursor:pointer;color:var(--faint)}
.kd.on{color:var(--text);text-decoration:underline}
.kd:hover{color:var(--text)}

/* ---------- board rows (ported verbatim) ---------- */
.grid-skill{grid-template-columns:18px 1fr 34px 36px 48px}
.row .pts,.t2 .pts{text-align:right;color:var(--faint);font-family:var(--mono);
  font-size:11px}
.grid-kdef{grid-template-columns:1fr 48px}
.row{display:grid;gap:6px;align-items:center;padding:5px 8px;cursor:pointer;
  user-select:none;border-left:3px solid transparent;line-height:1.3}
.rows .row:nth-child(odd){background:var(--zebra)}
.row:hover,.rows .row:nth-child(odd):hover{background:var(--sel)}
.row .tier{font-family:var(--mono);font-size:12px;color:var(--faint);
  text-align:center}
.row.t-open{border-top:2px solid var(--line)}
.row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:14.5px}
.row .tm{color:var(--faint);font-size:12px;margin-left:4px}
.row .inj{color:var(--bad);font-size:11px;font-weight:700;margin-left:3px}
.row .rk{color:var(--muted);font-size:11px;font-weight:700;margin-left:3px}
.row .edge{font-family:var(--mono);font-size:13px;text-align:right;
  color:var(--faint);font-variant-numeric:tabular-nums}
.row .edge.up{color:var(--good);font-weight:700}
.row .edge.dn{color:var(--bad)}
.row .usd{font-family:var(--mono);font-size:14.5px;font-weight:700;
  color:var(--gold);text-align:right;font-variant-numeric:tabular-nums}
.row .mkt{font-family:var(--mono);font-size:13.5px;color:var(--gold);
  text-align:right;font-variant-numeric:tabular-nums}
.row.sold .nm{text-decoration:line-through;color:var(--muted)}
.row.sold .tier{opacity:.4}
.row.sold .usd,.row.sold .mkt{color:var(--muted);font-weight:400;font-size:11.5px}
.more{display:block;width:100%;text-align:left;padding:7px 8px 14px 30px;
  color:var(--focus);font-size:13px;font-weight:700}
.more:hover{text-decoration:underline}
.freebar{display:flex;align-items:center;gap:8px;margin:7px 6px 2px;
  font-size:10px;font-weight:700;letter-spacing:.2em;color:var(--faint);
  user-select:none}
.freebar span{flex:1;border-top:2px solid var(--line)}
.subhead{padding:4px 8px;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);background:var(--raised)}

/* position colors */
.pQB{color:var(--pos-qb) !important}
.pRB{color:var(--pos-rb) !important}
.pWR{color:var(--pos-wr) !important}
.pTE{color:var(--pos-te) !important}
.pK{color:var(--pos-k) !important}
.pDEF{color:var(--pos-def) !important}
.pFLX{color:var(--pos-flx) !important}

/* staged pulse (ported) */
.row.staged{border-left-color:var(--gold);position:relative;z-index:1;
  animation:bidglow 1.1s ease-in-out infinite}
@keyframes bidglow{
  0%,100%{box-shadow:inset 0 0 0 1px var(--gold-dim)}
  50%{box-shadow:inset 0 0 0 2px var(--gold),0 0 20px rgba(217,166,72,.65)}}
@media (prefers-reduced-motion:reduce){
  .row.staged{animation:none;box-shadow:inset 0 0 0 2px var(--gold)}}

/* ---------- rail (ported) ---------- */
#rail{display:flex;flex-direction:column;background:var(--c-panel);
  gap:8px;padding:8px;color:var(--text);overflow-y:auto}
.panel{padding:12px 14px;background:var(--surface);border:1px solid var(--line);
  border-radius:6px}
.panel h2{font-size:10px;font-weight:700;letter-spacing:.22em;color:var(--muted);
  margin-bottom:9px;text-transform:uppercase}
#q{width:100%;background:var(--input);border:1px solid var(--line);
  border-radius:4px;padding:9px 11px;font-size:14px;outline:none}
#q:focus{border-color:var(--focus)}
#hits{margin-top:2px}
.hit{display:flex;gap:8px;align-items:center;width:100%;padding:6px 9px;
  border-radius:3px;font-size:13px;text-align:left}
.hit .p{color:var(--faint);font-size:11px;width:28px}
.hit .n{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hit .d{font-family:var(--mono);font-size:12px;color:var(--gold);font-weight:700}
.hit.sel,.hit:hover{background:var(--sel)}
#picked{display:none;margin-top:10px;padding:9px 11px;
  border:1px solid var(--gold-dim);border-radius:4px;background:var(--picked-bg)}
#picked .pnm{font-weight:700;font-size:14px}
#call{display:none;margin-top:8px;padding:10px 12px;border-radius:4px;
  border:1px solid var(--line);background:var(--surface)}
.cverdict{display:inline-block;font-size:11px;font-weight:700;
  letter-spacing:.14em;padding:3px 9px;border-radius:3px;text-transform:uppercase}
.cverdict.target{background:var(--good);color:#fff}
.cverdict.value{background:var(--gold);color:#fff}
.cverdict.last{background:var(--warn);color:#fff}
.cverdict.pass{background:var(--bad);color:#fff}
.cverdict.bench{background:var(--faint);color:#fff}
.cmax{margin-top:7px;font-size:14px}
.cmax b{font-family:var(--mono);font-size:18px;color:var(--gold)}
.cmax span{color:var(--faint);font-size:12px;font-family:var(--mono)}
/* actionable ceiling when it sits below his value: secondary to the gold worth */
.cceil{margin-top:3px;font-size:13px;color:var(--muted)}
.cceil b{font-family:var(--mono);font-size:15px;color:var(--text)}
.cceil small{color:var(--faint);font-size:11.5px}
#call ul{margin:7px 0 0;padding-left:16px}
#call li{font-size:12.5px;color:var(--muted);margin:3px 0;line-height:1.4}
#saleform{margin-top:10px}   /* always on screen (V55): price, roster, owners, DRAFT */
#salegrid{display:grid;grid-template-columns:1fr 25%;gap:10px;margin-top:6px;
  align-items:start}
#salegrid h2{margin-bottom:4px;margin-top:8px;font-size:10px;font-weight:700;
  letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
.steplab{font-size:9px;letter-spacing:.16em;color:var(--faint);
  text-transform:uppercase;margin:8px 0 4px}
#price{width:96px;background:var(--input);border:1px solid var(--line);
  border-radius:4px;padding:8px 10px;font-family:var(--mono);font-size:18px;
  color:var(--gold);font-weight:700;outline:none}
#price:focus{border-color:var(--gold)}
#ogrid{display:grid;grid-template-columns:1fr;gap:2px;margin-top:2px}
.obtn{display:block;width:100%;padding:4px 5px;overflow:hidden;white-space:nowrap;
  text-overflow:ellipsis;border:1px solid var(--line);border-radius:3px;
  font-size:11.5px;text-align:left;background:var(--ground)}
.obtn small{font-family:var(--mono);color:var(--faint)}
.obtn:hover,.obtn:focus{border-color:var(--focus);outline:none;background:var(--sel)}
.obtn.me{border-color:var(--gold-dim)}
.obtn.out{opacity:.4}
.obtn.selected{border-color:var(--focus);border-width:2px;background:var(--sel);
  color:var(--text);font-weight:700}
#summary{display:none;margin-top:10px;font-size:13px;color:var(--muted)}
#summary b{color:var(--text)}
#summary .g{color:var(--gold);font-family:var(--mono);font-weight:700}
#sold{display:block;width:100%;margin-top:9px;padding:11px;border-radius:4px;
  border:1px solid var(--gold-hi);color:#fdf9ee;background:var(--gold);
  font-weight:700;font-size:14px;letter-spacing:.14em}
#sold:hover:not(:disabled){background:var(--gold-hi)}
#sold:disabled{background:var(--surface);color:var(--faint);
  border-color:var(--line);cursor:default}
#msg{margin-top:7px;font-size:13px;font-weight:700;color:var(--bad);
  min-height:15px}

/* owner ledger (ported) */
.ohead,.orow{display:grid;grid-template-columns:1fr 46px 46px 32px;gap:6px}
.ohead{font-size:9px;letter-spacing:.14em;color:var(--faint);
  text-transform:uppercase;padding-bottom:5px;border-bottom:1px solid var(--line);
  margin-bottom:3px}
.ohead span:not(:first-child){text-align:right}
.orow{padding:3.5px 2px;font-size:13px;align-items:center}
.orow:nth-child(even){background:var(--zebra)}
.orow.me{font-weight:700}
.orow.me span:first-child{color:var(--gold-hi)}
.orow.out{opacity:.45}
.orow .m{font-family:var(--mono);font-size:12px;text-align:right}
.orow .m.g{color:var(--gold);font-weight:700}
.orow .sp{color:var(--faint);text-align:right;font-family:var(--mono);
  font-size:11px}

/* roster (ported) */
#roster .slot{display:flex;gap:8px;padding:3px 0;font-size:13px}
#roster .slot:nth-child(odd){background:var(--zebra)}
#roster .slot .lab{width:36px;color:var(--faint);font-family:var(--mono);
  font-size:11px;padding-top:1px}
#roster .slot .who{flex:1;color:var(--faint)}
#roster .slot.filled .who{color:var(--text)}
#roster .slot .pr{font-family:var(--mono);font-size:12px;color:var(--gold);
  font-weight:700}
#rostersel{background:var(--surface);color:var(--muted);border:none;
  outline:none;font-family:var(--ui);font-size:10px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;cursor:pointer;padding:0;
  max-width:100%}

/* ---------- modal (ported) ---------- */
#ovl{display:none;position:fixed;inset:0;background:rgba(43,37,54,.35);
  z-index:10;align-items:center;justify-content:center}
#modal{width:410px;max-height:80vh;overflow-y:auto;background:var(--ground);
  border:1px solid var(--line);border-radius:6px;padding:20px 22px;
  box-shadow:0 20px 60px rgba(43,37,54,.35)}
#modal h3{font-size:18px}
#modal .sub{color:var(--muted);font-size:13px;margin:3px 0 14px}
#mtable{width:100%;font-family:var(--mono);font-size:13px;
  border-collapse:collapse}
#mtable td{padding:5px 0;border-bottom:1px solid var(--line-soft)}
#mtable td:last-child{text-align:right}
#mtable .g{color:var(--gold);font-weight:700}
#msell{margin-top:14px;width:100%;padding:10px;border:1px solid var(--gold-dim);
  border-radius:4px;color:var(--gold-hi);font-weight:700;font-size:12px;
  letter-spacing:.14em;background:var(--picked-bg)}
#msell:hover{background:var(--raised)}
#mrev{margin-top:14px;width:100%;padding:10px;border:1px solid var(--bad);
  border-radius:4px;color:var(--bad);font-weight:700;font-size:12px;
  letter-spacing:.14em;background:none}
#mrev:hover{background:var(--raised)}

/* sold stamp (ported) */
#stamp{display:none;position:fixed;left:50%;top:40%;z-index:20;
  transform:translate(-50%,-50%) rotate(-7deg);
  border:3px solid var(--gold);border-radius:6px;padding:14px 30px;
  font-family:var(--disp);font-size:27px;letter-spacing:.2em;
  color:var(--gold-hi);background:var(--stamp-bg);
  box-shadow:0 12px 50px rgba(0,0,0,.35);pointer-events:none;text-align:center}
#stamp small{display:block;font-family:var(--mono);font-size:13px;
  letter-spacing:.02em;color:var(--text);margin-top:6px}
#stamp.show{display:block;animation:stamp .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{from{transform:translate(-50%,-50%) rotate(-7deg) scale(1.6);
  opacity:0}
  to{transform:translate(-50%,-50%) rotate(-7deg) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){#stamp.show{animation:none}}

/* ---------- instant tooltip ---------- */
[data-tip]{position:relative;cursor:help}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:0;
  top:calc(100% + 6px);z-index:30;width:260px;padding:8px 10px;
  border-radius:7px;background:var(--text);color:var(--ground);font-size:12px;
  font-weight:normal;line-height:1.4;text-transform:none;letter-spacing:normal;
  white-space:normal;box-shadow:0 4px 14px rgba(0,0,0,.25);
  font-family:var(--ui)}

/* ---------- wizard + import (this app's own surfaces, on the same tokens) */
.bigpanel{max-width:620px;margin:4vh auto;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:26px}
.bigpanel.wide{max-width:980px}
.bigpanel h2{margin-bottom:10px;font-size:18px}
.bigpanel textarea{margin:10px 0}
/* One stable card across steps: a flex column with a fixed min-height so short
 * steps do not collapse the box (and the Back/Next row stays put). Tall steps
 * still grow past it; the min is viewport-capped so it never overflows a phone. */
.wizard{width:100%;max-width:600px;margin:6vh auto;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:28px 30px;
  display:flex;flex-direction:column;min-height:min(500px,74vh)}
.wizbody{flex:1 1 auto}
.stepper{margin-bottom:18px}
.stepmeta{display:flex;justify-content:space-between;align-items:baseline;
  font-size:12px;color:var(--muted);margin-bottom:8px}
.stepmeta b{color:var(--text);font-size:13px}
.stepbar{height:4px;background:var(--line-soft);border-radius:2px;overflow:hidden}
.stepfill{height:100%;background:var(--gold);border-radius:2px;
  transition:width .25s ease}
.steps{display:flex;margin-top:8px}
.step{flex:1;font-size:11px;color:var(--faint);text-align:center}
.step:first-child{text-align:left}
.step:last-child{text-align:right}
.step.done{color:var(--muted)}
.step.done::before{content:"\2713 ";font-size:10px}
.step.on{color:var(--text);font-weight:600}
.wizintro{color:var(--muted);font-size:13px;margin:0 0 18px;padding-bottom:16px;
  border-bottom:1px solid var(--line-soft)}
.wizbody h2{margin:0 0 6px;font-size:20px;letter-spacing:-.01em}
.hint{color:var(--muted);font-size:13px;line-height:1.5;margin:0 0 16px;max-width:48ch}
/* data step: two option cards, the user's own data first */
.optcards{display:grid;gap:10px;margin:14px 0 6px}
.optcard{display:block;text-align:left;padding:14px 16px;border:1px solid var(--line);
  border-radius:8px;background:var(--raised);color:var(--text);font:inherit;
  cursor:pointer;transition:border-color .12s}
.optcard b{display:block;font-size:15px}
.optcard small{display:block;color:var(--muted);margin-top:3px;font-size:12.5px;
  line-height:1.4}
.optcard.primary{border-color:var(--gold);background:var(--surface)}
.optcard:hover:not(:disabled){border-color:var(--gold-hi)}
.optcard:disabled{opacity:.6;cursor:default}
.choices{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap;
  align-items:center}
.choice{border:1px solid var(--line);border-radius:6px;padding:7px 14px;
  background:var(--surface)}
.choice.on{background:var(--gold);color:#fdf9ee;border-color:var(--gold)}
.radio{display:inline-flex;gap:6px;align-items:center;font-size:14px;
  cursor:pointer}
.radio input{accent-color:var(--gold)}
button.primary{background:var(--gold);color:#fdf9ee;border:1px solid var(--gold-hi);
  border-radius:6px;padding:7px 14px}
button.primary.big{font-size:17px;padding:12px 26px}
button.primary:hover:not(:disabled){background:var(--gold-hi)}
button.ghost{background:transparent;border:1px solid var(--line);
  border-radius:6px;padding:7px 14px}
button.ghost.danger{color:var(--bad);border-color:var(--bad)}
button.ghost.tiny,.tiny{font-size:11px;padding:3px 8px}
button:disabled{opacity:.55;cursor:default}
.field{display:flex;flex-direction:column;gap:4px;margin:10px 0;
  font-size:13px;color:var(--muted)}
.field input{font:inherit;padding:6px 8px;border:1px solid var(--line);
  border-radius:6px;width:110px;color:var(--text);background:var(--input)}
.field input.wide{width:100%;max-width:340px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 14px}
.form{display:grid;grid-template-columns:1fr 110px;gap:8px 16px;
  align-items:center;margin-top:6px}
.formrow{display:contents}
.formrow span{font-size:13px;color:var(--muted);text-align:left}
.formrow input,.formrow select{font:inherit;padding:6px 8px;width:100%;
  border:1px solid var(--line);border-radius:6px;color:var(--text);
  text-align:right;background:var(--input)}
textarea{width:100%;font:inherit;padding:8px;border:1px solid var(--line);
  border-radius:6px;background:var(--input)}
.wiznav{display:flex;justify-content:space-between;margin-top:22px}
.wizleft{display:flex;gap:8px}
.locknote{font-size:11px;color:var(--faint)}
.msg{color:var(--bad);font-size:13px;margin-top:10px}
.tblwrap{overflow-x:auto;margin:12px 0}
.maptable{border-collapse:collapse;font-size:12px;width:100%}
.maptable td,.maptable th{border:1px solid var(--line);padding:4px 7px;
  text-align:left;white-space:nowrap;max-width:180px;overflow:hidden;
  text-overflow:ellipsis}
.maptable tr.hdr td{background:var(--raised);font-weight:bold}
.maptable select{font:inherit;font-size:12px;max-width:100%;padding:3px;
  border:1px solid var(--line);border-radius:5px;background:var(--input);
  color:var(--text)}
.empty{text-align:center;margin-top:10vh;color:var(--muted)}
.empty button{margin-top:14px}
/* ---------- run selector chip ---------- */
#runsel{background:var(--c-chip);color:var(--c-text);border:none;outline:none;
  font-family:var(--mono);font-size:13px;font-weight:700;cursor:pointer;
  padding:0;margin-top:1px;max-width:160px}

/* ---------- board tabs ---------- */
#btabs{display:flex;gap:2px;background:var(--c-bg);padding:6px 10px 0;
  border-bottom:1px solid var(--c-line);flex:none}
.btab{font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--c-muted);
  padding:6px 16px;border-radius:4px 4px 0 0}
.btab.on{color:var(--text);background:var(--ground);
  box-shadow:0 -2px 0 var(--gold) inset}
.btab:hover{color:var(--c-text)}

/* ---------- teams grid ---------- */
#teams{background:var(--ground);padding:10px;overflow-x:auto}
#tgrid{display:flex;gap:8px;min-width:max-content}
.tcol{width:148px;flex:0 0 148px}
.tcol .thead{padding:5px 6px;margin-bottom:6px;
  border-bottom:2px solid var(--line);font-size:12px;font-weight:700;
  color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcol .thead small{display:block;font-family:var(--mono);font-size:11px;
  font-weight:400;color:var(--muted)}
.tcol.meCol .thead{border-bottom-color:var(--gold);color:var(--gold-hi)}
.ttile{border-radius:4px;padding:6px 7px;margin-bottom:6px;cursor:pointer}
.ttile .tn{font-size:11.5px;font-weight:700;letter-spacing:.02em;
  text-transform:uppercase;line-height:1.25;margin-bottom:6px}
.ttile .tmeta{display:flex;justify-content:space-between;font-size:11px;
  color:var(--muted)}
.ttile .tmeta b{font-family:var(--mono);color:var(--text)}
.posbg-QB{background:var(--posbg-qb)} .posbg-RB{background:var(--posbg-rb)}
.posbg-WR{background:var(--posbg-wr)} .posbg-TE{background:var(--posbg-te)}
.posbg-K{background:var(--posbg-k)} .posbg-DEF{background:var(--posbg-def)}

/* ---------- collapsed column strip ---------- */
.poscol.min{cursor:pointer;background:var(--surface);display:flex;
  justify-content:center;padding-top:10px}
.poscol.min:hover{background:var(--raised)}
.poscol.min .minlab{writing-mode:vertical-rl;font-size:12px;font-weight:700;
  letter-spacing:.14em;white-space:nowrap;user-select:none;color:var(--muted)}
.poscol.min .minlab small{font-weight:400;font-size:10px;color:var(--faint);
  letter-spacing:.08em}
.colbtn{margin-left:auto;cursor:pointer;border:none;background:none;
  color:var(--faint);font-size:14px;padding:0 3px;line-height:1}
.colbtn:hover{color:var(--text)}

/* ---------- flow strip (right side of the masthead line, before the gear) -- */
#flow{display:flex;gap:5px;align-items:center}
#flow:empty{display:none}
.fcell{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
  font-size:11px;color:var(--c-muted);border:1px solid var(--c-line);
  border-radius:4px;padding:3px 7px;background:var(--c-chip);cursor:default}
.fcell b{font-family:var(--mono);font-size:12px;color:var(--c-text);
  font-weight:700}
.fcell.tight{border-color:var(--c-gold);color:var(--c-gold)}
.fcell.tight b{color:var(--c-gold)}
.fcell.crunch{border-color:var(--bad);color:var(--bad)}
.fcell.crunch b{color:var(--bad)}
.runmark{font-style:normal;font-size:9px;color:var(--c-gold);
  animation:runpulse 1.6s ease-in-out infinite}
.mdot{width:7px;height:7px;border-radius:50%;display:inline-block}
.mdot.exposed{background:var(--bad)}
.mdot.exploit{background:var(--good)}
@keyframes runpulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.runmark{animation:none}}

/* ---------- the call: slots + tags ---------- */
.cest{margin-top:2px;font-size:13px;color:var(--muted)}
.cest b{font-family:var(--mono);font-size:15px;color:var(--text)}
.cslots{margin:7px 0 3px}
.cslots .srow{display:flex;justify-content:space-between;align-items:center;
  font-size:13px;margin:2px 0;font-family:var(--mono)}
.cslots .pl{font-weight:700}

/* ---------- roster plan projections ---------- */
#roster .slot .pl{color:var(--faint);font-weight:400;cursor:help}

/* ---------- owner filter + states ---------- */
#ofilter{justify-self:start;font-family:var(--mono);font-size:11px;
  color:var(--gold);border:1px solid var(--gold-dim);border-radius:3px;
  padding:1px 7px;white-space:pre}
.obtn.dim{opacity:.35}
.obtn.hit{outline:1px solid var(--gold)}

/* ---------- favorites panel ---------- */
.favrow{display:flex;gap:8px;align-items:center;width:100%;padding:4px 2px;
  font-size:13px;text-align:left;border-radius:3px}
.favrow:hover{background:var(--sel)}
.favrow:nth-child(odd){background:var(--zebra)}
.favrow.out{opacity:.45}
.favrow .star{width:14px;text-align:center;color:var(--pos-def);font-size:12px}
.favrow .n{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.favrow .n .tm{color:var(--faint);font-size:11px;margin-left:4px}
.favrow .d{font-family:var(--mono);font-size:12px;color:var(--gold);
  font-weight:700}
/* favorite star on a board row */
.row .favm{color:var(--pos-def);font-size:11px;margin-left:4px}

/* ---------- modal head + favorite toggle + tabs ---------- */
#mtable .pos{color:var(--good);font-weight:700}
#mtable .neg{color:var(--bad);font-weight:700}
.mhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.mhl{display:flex;align-items:flex-start;gap:10px;min-width:0}
.mhname{min-width:0}
.mhname h3{margin:0}
#mclose{font-size:24px;line-height:1;color:var(--muted);padding:0 4px}
#mclose:hover{color:var(--text)}
#mfav{font-size:22px;line-height:1;color:var(--faint);padding:0 2px}
#mfav:hover{color:var(--pos-def)}
#mfav.on{color:var(--pos-def)}
/* under the hood: segmented tabs, a numbered pipeline, live element previews */
#modal.wide{width:540px;padding:22px 26px}
#mtabs{display:flex;margin:8px 0 16px;border:1px solid var(--line);
  border-radius:6px;padding:3px;background:var(--surface)}
.mtab{flex:1;font-size:12.5px;font-weight:700;letter-spacing:.02em;
  color:var(--muted);padding:7px 10px;border:none;border-radius:4px;
  background:transparent}
.mtab.on{color:var(--text);background:var(--raised);
  box-shadow:0 1px 0 var(--line-soft)}
.hlead{font-size:14px;line-height:1.55;color:var(--text);margin:0 0 18px}
.hpipe{position:relative}
.hpipe::before{content:"";position:absolute;left:12px;top:16px;bottom:16px;
  width:1px;background:var(--line)}
.hstep{display:flex;gap:14px;margin:0 0 18px;position:relative}
.hn{flex:none;width:25px;height:25px;border-radius:50%;background:var(--ground);
  border:1px solid var(--gold);color:var(--gold);font-family:var(--mono);
  font-size:11px;font-weight:700;display:inline-flex;align-items:center;
  justify-content:center;margin-top:1px;position:relative;z-index:1}
.hbody{min-width:0;flex:1}
.hbody h4{margin:4px 0 5px;font-size:14px;color:var(--text)}
.hbody p{margin:0 0 7px;font-size:13px;line-height:1.55;color:var(--muted)}
.hbody p b{color:var(--text)}
.hbody code{font-family:var(--mono);font-size:11.5px;background:var(--surface);
  padding:1px 4px;border-radius:3px}
.hpv{margin-top:8px;padding:8px 10px;background:var(--surface);
  border:1px solid var(--line-soft);border-radius:6px;font-size:12.5px}
.hrow{display:grid;grid-template-columns:1fr 46px 40px 46px;gap:6px;
  align-items:center;padding:3px 2px;font-family:var(--mono);font-size:12.5px;
  color:var(--text)}
.hrow span:nth-child(n+2){text-align:right}
.hrow small{color:var(--faint);font-size:10.5px;margin-left:3px}
.hrow.hhead{color:var(--faint);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;border-bottom:1px solid var(--line-soft);
  margin-bottom:2px}
.hrow .up{color:var(--good);font-weight:700}
.hrow .dn{color:var(--bad)}
.hrow .usd{font-weight:700;font-size:13.5px}
.hrow.htier{border-top:1px dashed var(--gold-dim);margin-top:3px;padding-top:5px}
.ht{font-style:normal;color:var(--faint);font-size:10px;margin-right:4px}
.hsearch{display:flex;gap:10px;align-items:center;font-size:12.5px;flex-wrap:wrap}
.hq{font-family:var(--mono);padding:3px 8px;border:1px solid var(--line);
  border-radius:4px;background:var(--input);color:var(--text)}
.hhit{color:var(--text)}
.hhit small{color:var(--faint)}
.hhit kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line);
  border-radius:3px;padding:0 4px;color:var(--muted);margin-left:4px}
.hcall{display:flex;flex-direction:column;gap:4px}
.hvp{align-self:flex-start;font-family:var(--disp);font-size:12px;
  letter-spacing:.14em;padding:3px 10px;border-radius:4px;background:var(--good);
  color:#fdf9ee;font-weight:700}
.hpv .cmax,.hpv .cest{font-size:12.5px;color:var(--muted)}
.hpv .cmax b,.hpv .cest b{color:var(--text)}
.hpv .fcell{margin:2px 6px 2px 0}
.hvp.fair{background:var(--gold)}
.hlist{margin:0 0 7px;padding-left:18px;font-size:13px;line-height:1.55;color:var(--muted)}
.hlist b{color:var(--text)}
.hgear{display:inline-block;font-size:13px;color:var(--text);padding:0 4px;
  border:1px solid var(--line);border-radius:3px;line-height:1.3}
.hsub{margin:-8px 0 12px 39px;position:relative}
.hsub::before{content:"";position:absolute;left:-27px;top:18px;width:14px;height:1px;
  background:var(--line)}
.hsub .hpv{margin-top:0}
.hcap{margin:0 0 9px;font-size:13px;color:var(--text);font-weight:600}
/* previews are display only: no hover, no cursor (the fade toggle is real) */
.hpv button:not(#availtog),.hpv .obtn,.hpv .hdraft{pointer-events:none}
.hlab{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
  margin-right:10px}
.hprice{display:flex;align-items:center}
.hpin{display:inline-block;width:72px;padding:5px 8px;border:1px solid var(--gold);
  border-radius:6px;background:var(--input);color:var(--text);font-family:var(--mono);
  font-size:15px;font-weight:700;text-align:right}
.hown{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hown .obtn{display:inline-block;width:auto;padding:4px 10px;border:1px solid var(--line);
  border-radius:6px;background:var(--surface);font-size:13px;color:var(--text)}
.hown .obtn.selected{border-color:var(--focus);border-width:2px;background:var(--sel)}
.hsumm{font-size:13px;color:var(--muted);margin-bottom:8px}
.hsumm b{color:var(--text)}
.hsumm .g{color:var(--gold);font-family:var(--mono);font-weight:700}
.hdraft{display:block;text-align:center;background:var(--gold);color:#fdf9ee;
  font-family:var(--disp);letter-spacing:.2em;font-weight:700;padding:9px;
  border-radius:6px;font-size:13px}
.hmc b{font-size:10px;letter-spacing:.16em;color:var(--faint)}
.hmc .callset{display:flex;align-items:center;gap:8px;margin:6px 0}
.hmc .cval{display:inline-flex;align-items:center;gap:2px;padding:4px 10px;
  border:1px solid var(--line);border-radius:6px;background:var(--input);
  font-family:var(--mono);font-size:15px;font-weight:700;color:var(--text)}
.hmc .callbtns{display:flex;gap:8px;margin-top:6px}
.hmc .callbtns .ghost{flex:1}
.hmc .callbtns .primary{flex:2}
.htog{width:100%;justify-content:space-between;font-size:13px;color:var(--text)}
.hnote2{display:block;margin-top:6px;font-size:11.5px;color:var(--faint)}
.hh{margin:6px 0 12px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint);border-top:1px solid var(--line-soft);padding-top:14px}
.hnote{margin:0 0 16px}
.hnote h4{margin:0 0 5px;font-size:14px;color:var(--text)}
.hnote p{margin:0 0 7px;font-size:13px;line-height:1.55;color:var(--muted)}
.hnote p b{color:var(--text)}
.hnote .mdot{margin:0 2px;vertical-align:middle}

/* ---------- gear divider + live read ---------- */
.gdiv{height:1px;background:var(--c-line);margin:6px 4px}
#liveread{margin-top:8px;padding-top:7px;border-top:1px solid var(--line-soft);
  font-size:13px;line-height:1.5;color:var(--text);white-space:pre-wrap;
  min-height:2.8em}
#liveread:empty{display:none;margin:0;padding:0;border:0}
#liveread.thinking{color:var(--faint);font-style:italic}

/* ---------- My Calls editor ---------- */
#callq{width:100%;background:var(--input);border:1px solid var(--line);
  border-radius:4px;padding:8px 11px;font-size:14px;outline:none}
#callq:focus{border-color:var(--focus)}
#callhits{margin-top:2px}
#callhits:not(:empty){margin-bottom:8px}
#calllist{display:flex;flex-direction:column;gap:2px;max-height:44vh;
  overflow-y:auto;margin-top:6px}
.callrow{display:grid;grid-template-columns:1fr 82px 62px 24px;gap:8px;
  align-items:center;padding:5px 2px;border-bottom:1px solid var(--line-soft)}
.callrow .cn{font-size:13px;overflow:hidden;white-space:nowrap;
  text-overflow:ellipsis}
.callrow select,.callrow input{font:inherit;font-size:12px;padding:4px 6px;
  border:1px solid var(--line);border-radius:4px;background:var(--input);
  color:var(--text)}
.callrow .cbv{text-align:right;width:100%}
.callrow .cbd{border:1px solid var(--line);border-radius:4px;color:var(--faint);
  background:none;font-size:12px;line-height:1;padding:4px 0}
.callrow .cbd:hover{color:var(--bad);border-color:var(--bad)}

/* ---------- modal inputs: use the app tokens, not browser defaults ---------- */
#modal input,#modal select{background:var(--input);color:var(--text);
  border:1px solid var(--line);border-radius:4px;padding:6px 8px;font:inherit}
#modal input:focus,#modal select:focus{border-color:var(--focus);outline:none}

/* ---------- My Call: set-a-value input in the player popup ---------- */
#mcalls{margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft)}
#mcalls b{color:var(--muted);font-size:10px;letter-spacing:.2em;display:block;
  margin-bottom:8px}
.callset{display:flex;align-items:center;gap:8px}
.callset .cstep{width:34px;height:38px;border:1px solid var(--line);
  border-radius:6px;font-family:var(--mono);font-size:18px;font-weight:700;
  color:var(--muted);background:var(--input)}
.callset .cstep:hover{color:var(--text);border-color:var(--focus)}
.cval{display:flex;align-items:center;gap:2px;border:1px solid var(--gold-dim);
  border-radius:6px;background:var(--input);padding:0 8px}
.cval .cd{font-family:var(--mono);color:var(--gold);font-size:18px;
  font-weight:700}
.cval input{width:56px;border:none;background:none;outline:none;text-align:left;
  font-family:var(--mono);font-size:20px;font-weight:700;color:var(--gold);
  padding:8px 0}
.callbtns{display:flex;gap:8px;margin-top:12px}
.callbtns #callclear{flex:1}
.callbtns #callsave{flex:2}
.callbtns #callclear:not(:disabled){color:var(--text);border-color:var(--focus)}
.callbtns #callclear:not(:disabled):hover{background:var(--surface)}
.chint{color:var(--faint);font-size:12px;margin-top:10px;line-height:1.4}
/* board marker for a called player */
.row .callm{font-family:var(--mono);font-size:10px;font-weight:700;
  margin-left:4px;padding:0 3px;border-radius:3px}
.row .callm.up{color:var(--good);border:1px solid var(--good)}
.row .callm.dn{color:var(--bad);border:1px solid var(--bad)}
/* board marker for a called player */
.row .callm{font-family:var(--mono);font-size:10px;font-weight:700;
  margin-left:4px;padding:0 3px;border-radius:3px}
.row .callm.up{color:var(--good);border:1px solid var(--good)}
.row .callm.dn{color:var(--bad);border:1px solid var(--bad)}

@media (max-width:1100px){.layout{grid-template-columns:1fr}
  #rail{order:-1}}
</style>
</head>
